version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omnienglish-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omniuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnipassword}
      POSTGRES_DB: ${POSTGRES_DB:-omnienglish_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniuser -d omnienglish_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: omnienglish-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnienglish-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-omniuser}:${POSTGRES_PASSWORD:-omnipassword}@postgres:5432/${POSTGRES_DB:-omnienglish_db}
      SYNC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-omniuser}:${POSTGRES_PASSWORD:-omnipassword}@postgres:5432/${POSTGRES_DB:-omnienglish_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-supersecret_omnienglish_jwt_key_32bytes_long}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omnienglish-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/v1/voice/ws
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
